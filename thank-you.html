<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You | Belle Vie Wellness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{--teal:#21a0a7;--red:#a70000;--cream:#f7f0f0;--ink:#243033}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,var(--cream),#fff);font-family:Montserrat,Arial,sans-serif;color:var(--ink)}
    .card{max-width:720px;background:#fff;border:1px solid rgba(33,160,167,.2);border-radius:30px;padding:42px;text-align:center;box-shadow:0 22px 60px rgba(24,39,43,.12)}
    img{width:250px;max-width:100%;margin:0 auto 24px}.mark{font-size:52px;color:var(--teal)} h1{font-family:'Playfair Display',serif;font-size:48px;margin:8px 0 14px} p{color:#637073;font-size:18px}
    .buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:26px}.btn{display:inline-flex;padding:13px 22px;border-radius:999px;background:var(--red);color:#fff;text-decoration:none;font-weight:800}.btn.alt{background:var(--teal)}
  </style>
</head>
<body>
  <main class="card">
    <img src="assets/belle-vie-logo.png" alt="Belle Vie Wellness logo">
    <div class="mark">✓</div>
    <h1>Thank you.</h1>
    <p>Your information has been submitted. A member of the Belle Vie Wellness team will follow up using your preferred contact method.</p>
    <div class="buttons">
      <a class="btn" href="index.html#book-now">Book Now</a>
      <a class="btn alt" href="index.html">Return Home</a>
    </div>
  </main>
</body>
</html>
